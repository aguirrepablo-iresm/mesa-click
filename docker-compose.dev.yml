services:
  api:
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      JWT_SECRET: "${JWT_SECRET:-dev_secret_mesa_click_local}"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/mesa_click?sslmode=disable"
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: ""

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
