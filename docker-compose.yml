version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mesa_click_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: mesa_click
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./repos/api
      dockerfile: Dockerfile
    container_name: mesa_click_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres_password@postgres:5432/mesa_click?sslmode=disable"
      JWT_SECRET: "super_secret_jwt_key_mesa_click_prod_2026"
      APP_ENV: "production"
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./repos/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    container_name: mesa_click_web
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped

volumes:
  pgdata:
